<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8fb">
  <title>CYUT 115-1｜課表規劃</title>
  <style>
    :root {
      --ink: #26343d;
      --muted: #71808a;
      --quiet: #9aa7ae;
      --line: #dbe4e9;
      --line-strong: #c6d5dc;
      --paper: #fafcfd;
      --paper-strong: #f5f8fa;
      --sky: #e5f0f7;
      --sky-deep: #466f87;
      --aqua: #e4f2ef;
      --aqua-deep: #4b7c78;
      --violet: #ececf5;
      --warn: #b67a6c;
      --warn-bg: #fbf0ed;
      --ok: #4e8278;
      --ok-bg: #eef7f3;
      --shadow: 0 24px 64px rgba(57, 79, 91, .12);
      --glass: rgba(255, 255, 255, .14);
      --glass-border: rgba(255, 255, 255, .62);
      --sky-image: url("sky-clouds-reference-pale.png");
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: #f3f7fa; }
    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: #f5f8fa;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      letter-spacing: .008em;
    }
    body::before {
      position: fixed;
      inset: 0;
      z-index: -2;
      content: "";
      background:
        radial-gradient(circle at 14% 12%, rgba(145, 205, 226, .34), transparent 25%),
        radial-gradient(circle at 83% 24%, rgba(167, 195, 226, .30), transparent 29%),
        radial-gradient(ellipse at 58% 86%, rgba(189, 224, 235, .28), transparent 38%),
        linear-gradient(180deg, rgba(238, 248, 253, .16), rgba(247, 250, 252, .34)),
        var(--sky-image) center bottom / cover no-repeat;
      filter: saturate(.44) brightness(1.02) contrast(1.04);
      opacity: .94;
      pointer-events: none;
    }
    body::after {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      background: linear-gradient(180deg, rgba(247, 250, 252, .04), rgba(247, 250, 252, .16) 54%, rgba(247, 250, 252, .34));
      pointer-events: none;
    }
    body.landing-active { overflow: hidden; }
    .landing-screen {
      --landing-x: 50%;
      --landing-y: 50%;
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at var(--landing-x) var(--landing-y), rgba(155, 204, 225, .42), transparent 16rem),
        radial-gradient(ellipse at 50% 115%, rgba(186, 220, 232, .58), transparent 54%),
        linear-gradient(128deg, #dcecf3 0%, #f5f8fa 47%, #c7e0eb 100%);
      cursor: crosshair;
      isolation: isolate;
      opacity: 1;
      transform: scale(1);
      transition: opacity 500ms cubic-bezier(.16, 1, .3, 1), transform 500ms cubic-bezier(.16, 1, .3, 1);
    }
    .landing-screen.is-leaving {
      opacity: 0;
      transform: scale(1.035);
      pointer-events: none;
    }
    .landing-screen[hidden] { display: none; }
    .landing-screen::before {
      position: absolute;
      inset: -12%;
      z-index: -1;
      content: "";
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .032) 0 1px, transparent 1px 8px),
        radial-gradient(circle at 50% 50%, transparent 0 20%, rgba(70, 111, 135, .12) 82%);
      opacity: .48;
      mix-blend-mode: multiply;
      pointer-events: none;
    }
    .landing-screen::after {
      position: absolute;
      inset: 0;
      z-index: -1;
      content: "";
      background: radial-gradient(circle at var(--landing-x) var(--landing-y), rgba(255, 255, 255, .52), transparent 7rem);
      opacity: .88;
      transition: opacity 120ms ease-out;
      pointer-events: none;
    }
    .landing-canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .landing-center {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: clamp(28px, 5vh, 52px);
      padding: 24px;
      text-align: center;
    }
    .landing-wordmark {
      position: relative;
      font-size: clamp(4.2rem, 15vw, 12rem);
      font-weight: 600;
      letter-spacing: -.12em;
      line-height: .8;
      color: rgba(70, 111, 135, .94);
      text-shadow: 0 16px 60px rgba(70, 111, 135, .18), 0 0 34px rgba(255, 255, 255, .66);
      user-select: none;
    }
    .landing-wordmark::after {
      position: absolute;
      inset: -28% -18%;
      z-index: -1;
      content: "";
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(155, 204, 225, .26), transparent 68%);
      filter: blur(18px);
      pointer-events: none;
    }
    .landing-enter {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      padding: 12px 20px 12px 22px;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 999px;
      color: var(--sky-deep);
      background: linear-gradient(135deg, rgba(255, 255, 255, .72), rgba(228, 242, 247, .72));
      box-shadow: 0 18px 48px rgba(57, 91, 107, .16), inset 0 1px 0 rgba(255, 255, 255, .92);
      font-size: .98rem;
      font-weight: 600;
      letter-spacing: .04em;
      transition: transform 140ms cubic-bezier(.34, 1.56, .64, 1), box-shadow 180ms ease, background 180ms ease;
    }
    .landing-enter span { font-size: 1.18em; line-height: 1; }
    .landing-enter:hover { transform: translateY(-2px) scale(1.02); background: rgba(255, 255, 255, .92); box-shadow: 0 24px 58px rgba(57, 91, 107, .2), inset 0 1px 0 rgba(255, 255, 255, 1); }
    .landing-enter:active { transform: scale(.96); }
    .landing-enter:focus-visible { outline-color: rgba(220, 244, 255, .9); }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .52; }
    :focus-visible { outline: 3px solid rgba(70, 111, 135, .28); outline-offset: 3px; }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      min-height: 100vh;
      max-width: 1580px;
      margin: 0 auto;
      transition: grid-template-columns 360ms var(--ease);
    }
    .app-shell.panel-open {
      grid-template-columns: minmax(0, 1fr) minmax(350px, 430px);
    }
    .content-column { min-width: 0; }
    .topbar {
      position: sticky;
      top: 16px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      min-height: 68px;
      margin: 16px clamp(16px, 3.4vw, 48px) 0;
      padding: 12px 16px 12px 20px;
      border: 1px solid rgba(255, 255, 255, .62);
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255, 255, 255, .09), rgba(155, 215, 233, .16) 54%, rgba(255, 255, 255, .07));
      box-shadow: 0 20px 48px rgba(57, 91, 107, .14), inset 1px 1px 0 rgba(255, 255, 255, .80), inset 0 -16px 34px rgba(108, 193, 219, .12), inset -1px -1px 0 rgba(117, 182, 205, .18);
      backdrop-filter: blur(32px) saturate(1.28) contrast(1.04);
      -webkit-backdrop-filter: blur(32px) saturate(1.28) contrast(1.04);
      isolation: isolate;
      overflow: hidden;
      --shine-x: 16%;
      --shine-y: 8%;
    }
    .topbar::before,
    .panel-frame::before,
    .glass-control::before,
    .toast::before {
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .86), transparent 20%, transparent 62%, rgba(255, 255, 255, .08)),
        radial-gradient(ellipse at 14% 0%, rgba(255, 255, 255, .48), transparent 42%),
        radial-gradient(ellipse at 92% 110%, rgba(102, 190, 219, .22), transparent 48%);
      content: "";
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: .58;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18);
    }
    .topbar::after,
    .panel-frame::after,
    .glass-control::after,
    .toast::after {
      position: absolute;
      inset: -24%;
      z-index: 0;
      border-radius: inherit;
      background:
        radial-gradient(ellipse at var(--shine-x) var(--shine-y), rgba(255, 255, 255, .52), transparent 23%),
        linear-gradient(116deg, transparent 28%, rgba(255, 255, 255, .22) 38%, transparent 49%),
        radial-gradient(ellipse at 90% 110%, rgba(102, 190, 219, .22), transparent 34%);
      content: "";
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: .38;
      filter: blur(3px);
      transition: opacity 120ms ease;
    }
    .topbar.is-lit::before,
    .panel-frame.is-lit::before,
    .glass-control.is-lit::before,
    .toast.is-lit::before { opacity: .78; }
    .topbar.is-lit::after,
    .panel-frame.is-lit::after,
    .glass-control.is-lit::after,
    .toast.is-lit::after { opacity: .82; }
    .topbar > *, .panel-inner, .glass-control > * { position: relative; z-index: 1; }
    .brand { min-width: 0; }
    .eyebrow {
      display: block;
      color: var(--quiet);
      font-size: .68rem;
      font-weight: 760;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .brand h1 {
      margin: 0;
      color: var(--ink);
      font-size: 1.18rem;
      font-weight: 620;
      letter-spacing: -.025em;
      line-height: 1.04;
    }
    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: .8rem;
    }
    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }
    .data-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-right: 8px;
      color: var(--muted);
      font-size: .73rem;
      white-space: nowrap;
    }
    .data-status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7ca79f;
      box-shadow: 0 0 0 4px rgba(124, 167, 159, .15);
      content: "";
    }
    .glass-control {
      min-height: 38px;
      padding: 8px 13px;
      border: 1px solid var(--glass-border);
      border-radius: 13px;
      color: #4d6c7b;
      position: relative;
      border-color: rgba(255, 255, 255, .60);
      border-radius: 16px;
      color: #3f687b;
      background: linear-gradient(135deg, rgba(255, 255, 255, .08), rgba(150, 211, 232, .16));
      box-shadow: inset 1px 1px 0 rgba(255, 255, 255, .76), inset -1px -1px 0 rgba(116, 164, 182, .10), 0 12px 28px rgba(46, 78, 93, .11);
      backdrop-filter: blur(30px) saturate(1.32) contrast(1.05);
      -webkit-backdrop-filter: blur(30px) saturate(1.32) contrast(1.05);
      isolation: isolate;
      overflow: hidden;
      transition: transform 140ms var(--ease), background 180ms ease, box-shadow 180ms ease;
    }
    .glass-control:hover { transform: translateY(-1px) scale(1.02); background: linear-gradient(135deg, rgba(255, 255, 255, .32), rgba(225, 243, 250, .13)); box-shadow: inset 1px 1px 0 #fff, 0 16px 30px rgba(46, 78, 93, .15); }
    .glass-control:active { transform: scale(.97); }
    .glass-control.primary { color: #f8fcfd; background: linear-gradient(135deg, rgba(63, 108, 130, .78), rgba(77, 139, 160, .48)); }

    .main-content { padding: 20px clamp(20px, 3.4vw, 48px) 54px; }
    .schedule-board {
      --schedule-row-height: 76px;
      --schedule-head-height: 43px;
      --schedule-cell-width: 108px;
      --schedule-period-width: 54px;
      --schedule-min-width: 760px;
      --schedule-font-size: .72rem;
      --slot-min-height: 58px;
      overflow: hidden;
      border: 1px solid rgba(210, 222, 228, .94);
      border-radius: 26px;
      background: var(--paper);
      box-shadow: var(--shadow);
      transition: filter 360ms ease, transform 360ms var(--ease), opacity 360ms ease;
    }
    .panel-open .schedule-board { filter: saturate(.58); opacity: .92; transform: scale(.985); }
    .board-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding: 28px 30px 23px;
      border-bottom: 1px solid var(--line);
    }
    .board-head h2 {
      margin: 5px 0 6px;
      font-size: 1.04rem;
      font-weight: 620;
      letter-spacing: -.015em;
    }
    .board-head p { margin: 0; color: var(--muted); font-size: .8rem; }
    .board-metrics {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }
    .board-tools { display: flex; align-items: flex-end; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
    .metric {
      min-width: 76px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f5f8fa;
      text-align: right;
    }
    .metric small, .metric strong { display: block; }
    .metric small { color: var(--quiet); font-size: .66rem; }
    .metric strong { margin-top: 2px; color: var(--ink); font-size: 1.02rem; font-weight: 700; }
    .calendar-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      scrollbar-width: thin;
      touch-action: pan-y;
    }
    .schedule {
      width: 100%;
      min-width: var(--schedule-min-width);
      border-collapse: collapse;
      table-layout: fixed;
      font-size: var(--schedule-font-size);
    }
    .schedule th, .schedule td {
      height: var(--schedule-row-height);
      padding: 6px;
      border-right: 1px solid #e1e8ec;
      border-bottom: 1px solid #e1e8ec;
      vertical-align: top;
    }
    .schedule th {
      height: var(--schedule-head-height);
      color: #5c737e;
      background: #f3f7f9;
      font-size: .72rem;
      font-weight: 760;
      text-align: center;
    }
    .schedule th:first-child, .schedule td.period { width: var(--schedule-period-width); }
    .schedule td.period {
      color: var(--quiet);
      background: #f6f9fa;
      font-weight: 700;
      text-align: center;
    }
    .schedule td[data-day] {
      position: relative;
      transition: background 160ms ease, box-shadow 160ms ease;
    }
    .schedule td[data-day]::after {
      position: absolute;
      inset: 5px;
      z-index: 0;
      border-radius: 9px;
      background: rgba(255, 255, 255, .58);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .82), 0 0 18px rgba(255, 255, 255, .22);
      content: "";
      opacity: 0;
      pointer-events: none;
      transform: scale(.96);
      transition: opacity 180ms ease, background 180ms ease, box-shadow 180ms ease, transform 220ms var(--ease);
    }
    .schedule td[data-day] > .slot { position: relative; z-index: 1; }
    body.is-dragging .schedule td[data-day] { cursor: copy; }
    body.is-dragging .schedule td[data-day].drag-candidate::after,
    body.is-dragging .schedule td[data-day].drag-over-safe::after {
      opacity: .88;
      transform: scale(1);
    }
    body.is-dragging .schedule td[data-day].drag-conflict::after,
    body.is-dragging .schedule td[data-day].drag-over-conflict::after {
      background: rgba(236, 184, 176, .34);
      box-shadow: inset 0 0 0 1px rgba(201, 123, 109, .28), 0 0 18px rgba(201, 123, 109, .16);
    }
    .schedule td[data-day]:hover, .schedule td[data-day].is-drop-target {
      background: #edf6f7;
      box-shadow: inset 0 0 0 2px rgba(75, 124, 120, .2);
    }
    .slot {
      display: block;
      width: 100%;
      min-height: var(--slot-min-height);
      padding: 8px 8px 7px;
      border: 1px solid rgba(255, 255, 255, .96);
      border-radius: 11px;
      color: #304d5b;
      background: var(--sky);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .93), 0 6px 13px rgba(67, 104, 120, .08);
      text-align: left;
      transition: transform 140ms var(--ease), box-shadow 180ms ease, background 220ms ease;
    }
    .slot:hover { transform: translateY(-1px) scale(1.012); box-shadow: inset 0 1px 0 #fff, 0 9px 16px rgba(67, 104, 120, .13); }
    .slot span, .slot small { display: block; }
    .slot span { overflow: hidden; font-size: .75rem; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .slot small { margin-top: 6px; color: rgba(48, 77, 91, .7); font-size: .64rem; line-height: 1.35; }
    .slot.tone-1 { background: var(--aqua); color: #385d5c; }
    .slot.tone-2 { background: var(--violet); color: #5d5f7b; }
    .slot.tone-3 { background: #e7eef2; color: #496674; }
    .slot.tone-4 { background: #eaf2f0; color: #4b6e6c; }
    .slot.labor { background: #e2eef5; color: #496b81; }
    .slot.required-human { background: #e9edf7; color: #5c6581; }
    .slot.required-social { background: #e8f0f2; color: #55727b; }
    .slot.required-natural { background: #e9f1ec; color: #5b786e; }
    .slot.required-comprehensive { background: #edf0f5; color: #66718a; }
    .slot.required-english { background: #e5f0f5; color: #547789; }
    .slot.required-basic { background: #eef3f4; color: #60777d; }
    .slot.department { background: #e4eff4; color: #506f7f; }
    .slot.conflict { background: var(--warn-bg); color: #a65e52; box-shadow: inset 0 0 0 1px rgba(182, 122, 108, .42), 0 6px 13px rgba(182, 122, 108, .11); }
    .schedule-board.schedule-scale-1 { --schedule-row-height: 56px; --schedule-head-height: 36px; --schedule-period-width: 42px; --schedule-min-width: 700px; --schedule-font-size: .62rem; --slot-min-height: 42px; }
    .schedule-board.schedule-scale-2 { --schedule-row-height: 66px; --schedule-head-height: 40px; --schedule-period-width: 48px; --schedule-min-width: 730px; --schedule-font-size: .67rem; --slot-min-height: 50px; }
    .schedule-board.schedule-scale-3 { --schedule-row-height: 76px; --schedule-head-height: 43px; --schedule-period-width: 54px; --schedule-min-width: 760px; --schedule-font-size: .72rem; --slot-min-height: 58px; }
    .schedule-board.schedule-scale-4 { --schedule-row-height: 88px; --schedule-head-height: 48px; --schedule-period-width: 58px; --schedule-min-width: 820px; --schedule-font-size: .78rem; --slot-min-height: 70px; }
    .schedule-board.schedule-scale-5 { --schedule-row-height: 104px; --schedule-head-height: 54px; --schedule-period-width: 64px; --schedule-min-width: 900px; --schedule-font-size: .84rem; --slot-min-height: 82px; }
    .schedule-size { display: flex; align-items: center; gap: 4px; color: var(--quiet); font-size: .68rem; }
    .schedule-size-label { margin-right: 2px; }
    .schedule-size button {
      width: 26px;
      height: 26px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: #f7fafb;
      transition: transform 140ms var(--ease), background 180ms ease, color 180ms ease, box-shadow 180ms ease;
    }
    .schedule-size button:hover { transform: translateY(-1px) scale(1.02); background: #fff; }
    .schedule-size button.is-active { color: #fff; background: var(--sky-deep); border-color: rgba(63, 108, 130, .35); box-shadow: 0 5px 12px rgba(63, 108, 130, .16); }
    .schedule-board.has-course-focus .slot:not(.focused-slot):not(.schedule-variant) { opacity: .18; filter: saturate(.58); }
    .schedule-board.has-course-focus .slot.focused-slot { opacity: 1; filter: none; box-shadow: inset 0 0 0 2px rgba(63, 108, 130, .30), 0 8px 18px rgba(63, 108, 130, .16); }
    .schedule-variant {
      position: relative;
      border-style: dashed;
      border-color: rgba(255, 255, 255, .90);
      color: #5f7784;
      background: rgba(231, 240, 244, .92);
      opacity: .66;
      box-shadow: inset 0 0 0 1px rgba(133, 168, 181, .15), 0 4px 12px rgba(67, 104, 120, .06);
    }
    .schedule-board.has-course-focus .schedule-variant.is-primary-variant { opacity: .96; box-shadow: inset 0 0 0 2px rgba(63, 108, 130, .24), 0 8px 18px rgba(63, 108, 130, .14); }
    .schedule-variant-conflict { color: #a65e52; background: rgba(236, 184, 176, .42); border-color: rgba(201, 123, 109, .42); }
    .schedule-focus-tools { display: grid; gap: 8px; min-width: min(100%, 520px); }
    .schedule-focus-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .schedule-focus-status { min-height: 1.1em; color: #557481; font-size: .72rem; }
    .schedule-focus-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
    .schedule-focus-add { min-height: 32px; padding: 6px 12px; border-radius: 12px; font-size: .72rem; }
    .schedule-focus-options { display: flex; gap: 6px; max-width: min(100%, 520px); overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: thin; }
    .focus-variant-option {
      display: grid;
      flex: 0 0 auto;
      gap: 2px;
      min-width: 78px;
      padding: 7px 9px;
      border: 1px solid rgba(219, 224, 227, .94);
      border-radius: 11px;
      color: #5c747f;
      background: rgba(250, 251, 252, .88);
      text-align: left;
      transition: transform 140ms var(--ease), background 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }
    .focus-variant-option:hover { transform: translateY(-1px) scale(1.02); background: #fff; }
    .focus-variant-option.is-current { color: #315f72; border-color: rgba(63, 108, 130, .42); background: #e8f2f5; box-shadow: inset 0 0 0 1px rgba(63, 108, 130, .12); }
    .focus-variant-option.is-conflict { color: #a65e52; border-color: rgba(201, 123, 109, .38); background: rgba(236, 184, 176, .28); }
    .focus-variant-option.is-selected { box-shadow: inset 0 0 0 1px rgba(63, 108, 130, .24); }
    .focus-variant-option strong { font-size: .72rem; }

    laborRows.forEach(function(row, index) {
      const course = makeCourse([row[0], "勞作教育", 1, row[3], row[1], row[2], "第二階段開放；20 門中擇 1 門。", "中文", 200], "labor", index);
      allCourses.push(course);
      byId.set(course.id, course);
    });
    requiredRows.forEach(function(row, index) {
      const course = makeCourse(row, "required", index);
      allCourses.push(course);
      byId.set(course.id, course);
    });
    departmentRows.forEach(function(row, index) {
      const course = makeCourse(row, "department", index);
      allCourses.push(course);
      byId.set(course.id, course);
    });

    const appShell = document.getElementById("appShell");
    const panelFrame = document.getElementById("panelFrame");
    const panelContent = document.getElementById("panelContent");
    const scheduleBody = document.getElementById("scheduleBody");
    const scheduleBoard = document.getElementById("scheduleBoard");
    const calendarScroll = document.querySelector(".calendar-scroll");
    const scheduleFocusTools = document.getElementById("scheduleFocusTools");
    const scheduleFocusStatus = document.getElementById("scheduleFocusStatus");
    const scheduleFocusOptions = document.getElementById("scheduleFocusOptions");
    const scheduleFocusAdd = document.getElementById("scheduleFocusAdd");
    const scheduleFocusBrowse = document.getElementById("scheduleFocusBrowse");
    const scheduleFocusClear = document.querySelector("[data-action=\"clear-focus\"]");
    const toast = document.getElementById("toast");
    const dragStatus = document.getElementById("dragStatus");

    function readScheduleScale() {
      const saved = Number(localStorage.getItem(scheduleScaleKey));
      return Number.isInteger(saved) && saved >= 1 && saved <= 5 ? saved : 3;
    }

    function applyScheduleScale(nextScale) {
      scheduleScale = Math.max(1, Math.min(5, Number(nextScale) || 3));
      if (scheduleBoard) {
        scheduleBoard.classList.remove("schedule-scale-1", "schedule-scale-2", "schedule-scale-3", "schedule-scale-4", "schedule-scale-5");
        scheduleBoard.classList.add("schedule-scale-" + scheduleScale);
      }
      document.querySelectorAll("[data-schedule-scale]").forEach(function(button) {
        const active = Number(button.dataset.scheduleScale) === scheduleScale;
        button.classList.toggle("is-active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      localStorage.setItem(scheduleScaleKey, String(scheduleScale));
    }

    function selectedCourses() {
      return allCourses.filter(function(course) { return selectedIds.has(course.id); });
    }

    function conflictCoursesFor(course) {
      return selectedCourses().filter(function(other) {
        return other.id !== course.id && other.day === course.day && course.periods.some(function(period) {
          return other.periods.indexOf(period) !== -1;
        });
      });
    }

    function conflictNames(courses) {
      const names = [];
      const seen = new Set();
      courses.forEach(function(course) {
        const label = course.code + " " + course.name;
        if (!seen.has(label)) {
          seen.add(label);
          names.push(label);
        }
      });
      return names.slice(0, 3).join("、") + (names.length > 3 ? "…" : "");
    }

    function clearDragPreview() {
      document.body.classList.remove("is-dragging");
      scheduleBody.querySelectorAll("td[data-day]").forEach(function(cell) {
        cell.classList.remove("drag-candidate", "drag-conflict", "drag-over-safe", "drag-over-conflict", "is-drop-target");
      });
      if (dragStatus) {
        dragStatus.classList.remove("is-visible", "is-conflict");
        dragStatus.textContent = "";
      }
    }

    function showDragPreview(course) {
      if (!course) return;
      const conflicts = conflictCoursesFor(course);
      const conflictKeys = new Set();
      conflicts.forEach(function(other) {
        other.periods.forEach(function(period) { conflictKeys.add(other.day + "-" + period); });
      });
      const targetKeys = new Set(course.periods.map(function(period) { return course.day + "-" + period; }));
      scheduleBody.querySelectorAll("td[data-day]").forEach(function(cell) {
        const key = cell.dataset.day + "-" + cell.dataset.period;
        if (!targetKeys.has(key)) return;
        cell.classList.add("drag-candidate");
        if (conflictKeys.has(key)) cell.classList.add("drag-conflict");
      });
      document.body.classList.add("is-dragging");
      if (dragStatus) {
        const periodLabel = course.period ? String(course.period).split(" ")[0] : "待核對";
        dragStatus.textContent = conflicts.length ? "衝堂：" + conflictNames(conflicts) : "可新增：星期" + (course.day || "—") + "・第 " + periodLabel + " 節";
        dragStatus.classList.toggle("is-conflict", conflicts.length > 0);
        dragStatus.classList.add("is-visible");
      }
    }

    function markDragHover(cell, course) {
      scheduleBody.querySelectorAll(".is-drop-target, .drag-over-safe, .drag-over-conflict").forEach(function(item) {
        item.classList.remove("is-drop-target", "drag-over-safe", "drag-over-conflict");
      });
      cell.classList.add("is-drop-target");
      const period = Number(cell.dataset.period);
      const conflictKeys = new Set();
      conflictCoursesFor(course).forEach(function(other) {
        other.periods.forEach(function(otherPeriod) { conflictKeys.add(other.day + "-" + otherPeriod); });
      });
      if (conflictKeys.has(cell.dataset.day + "-" + period)) cell.classList.add("drag-over-conflict");
      else if (course.day === cell.dataset.day && course.periods.indexOf(period) !== -1) cell.classList.add("drag-over-safe");
    }

    function audit() {
      const selected = selectedCourses();
      const cells = new Map();
      selected.forEach(function(course) {
        course.periods.forEach(function(period) {
          const key = course.day + "-" + period;
          if (!cells.has(key)) cells.set(key, []);
          cells.get(key).push(course);
        });
      });
      const conflictKeys = new Set();
      const conflictCourseIds = new Set();
      const conflictGroups = [];
      cells.forEach(function(courses, key) {
        if (courses.length > 1) {
          conflictKeys.add(key);
          conflictGroups.push(courses);
          courses.forEach(function(course) { conflictCourseIds.add(course.id); });
        }
      });
      const current = selected.filter(function(course) { return course.stage === "current"; });
      const required = selected.filter(function(course) { return course.stage === "required"; });
      const labor = selected.filter(function(course) { return course.stage === "labor"; });
      const department = selected.filter(function(course) { return course.stage === "department"; });
      const errors = [];
      const warnings = [];
      if (conflictKeys.size) {
        const names = [];
        const seen = new Set();
        conflictGroups.forEach(function(courses) {
          courses.forEach(function(course) {
            const label = course.code + " " + course.name;
            if (!seen.has(label)) {
              seen.add(label);
              names.push(label);
            }
          });
        });
        errors.push("衝堂：" + names.join("、"));
      }
      if (labor.length > 1) errors.push("勞作教育限 1 門：目前 " + labor.length + " 門");
      if (current.reduce(function(total, course) { return total + course.credits; }, 0) < 3) warnings.push("校訂選修未滿 3 學分");
      if (!labor.length) warnings.push("第二階段：勞作教育未選");
      selected.filter(function(course) { return course.restricted; }).forEach(function(course) {
        warnings.push(course.code + "：有選課條件");
      });
      selected.filter(function(course) { return course.closed; }).forEach(function(course) {
        errors.push(course.code + "：不可選");
      });
      return {
        selected: selected,
        current: current,
        required: required,
        labor: labor,
        department: department,
        errors: errors,
        warnings: warnings,
        conflictKeys: conflictKeys,
        conflictCourseIds: conflictCourseIds,
        currentCredits: current.reduce(function(total, course) { return total + course.credits; }, 0),
        requiredCredits: required.reduce(function(total, course) { return total + course.credits; }, 0),
        laborCredits: labor.reduce(function(total, course) { return total + course.credits; }, 0),
        departmentCredits: department.reduce(function(total, course) { return total + course.credits; }, 0)
      };
    }

    function sameCourseFamily(course, focusCourse) {
      return Boolean(course && focusCourse && course.stage === focusCourse.stage && course.name === focusCourse.name);
    }

    function focusedCourseVariants(focusCourse) {
      if (!focusCourse) return [];
      return allCourses.filter(function(course) {
        return sameCourseFamily(course, focusCourse) && course.day && course.periods.length;
      });
    }

    function focusedVariantGroups(focusCourse) {
      const groups = new Map();
      focusedCourseVariants(focusCourse).forEach(function(course) {
        if (selectedIds.has(course.id)) return;
        course.periods.forEach(function(period) {
          const key = course.day + "-" + period;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(course);
        });
      });
      return groups;
    }

    function renderVariantSlot(group, focusCourse, key) {
      if (!group || !group.length) return "";
      const codes = Array.from(new Set(group.map(function(course) { return course.code; })));
      const conflicts = [];
      const conflictIds = new Set();
      group.forEach(function(course) {
        conflictCoursesFor(course).forEach(function(other) {
          if (!conflictIds.has(other.id)) {
            conflictIds.add(other.id);
            conflicts.push(other);
          }
        });
      });
      const isPrimary = group.some(function(course) { return course.id === scheduleFocusId; });
      const first = group[0];
      const codeSummary = codes.slice(0, 4).join(" / ") + (codes.length > 4 ? " +" + (codes.length - 4) : "");
      const conflictSummary = conflicts.length ? "；衝堂：" + conflictNames(conflicts) : "";
      const periodText = String(first.period || "").split(" ")[0];
      const className = "slot schedule-variant" + (isPrimary ? " is-primary-variant" : "") + (conflicts.length ? " schedule-variant-conflict" : "");
      const aria = "查看 " + first.name + "；課號 " + codes.join("、") + conflictSummary;
      return '<button class="' + className + '" type="button" data-action="focus-variant" data-id="' + first.id + '" title="' + escapeHtml(aria) + '" aria-label="' + escapeHtml(aria) + '">' +
        "<span>" + escapeHtml(first.name.length > 11 ? first.name.slice(0, 11) + "…" : first.name) + "</span>" +
        "<small>" + escapeHtml(codeSummary) + " · " + escapeHtml(periodText) + (conflicts.length ? " · 衝堂" : "") + "</small></button>";
    }

    function renderFocusOption(course, focusCourse) {
      const isCurrent = course.id === focusCourse.id;
      const isSelected = selectedIds.has(course.id);
      const conflicts = conflictCoursesFor(course);
      const periodText = String(course.period || "待核對").split(" ")[0];
      const label = course.code + "・星期" + (course.day || "—") + "・" + periodText + (conflicts.length ? "・衝堂：" + conflictNames(conflicts) : "");
      return '<button class="focus-variant-option' + (isCurrent ? " is-current" : "") + (isSelected ? " is-selected" : "") + (conflicts.length ? " is-conflict" : "") + '" type="button" data-action="focus-variant" data-id="' + course.id + '" aria-pressed="' + isCurrent + '" aria-label="' + escapeHtml(label) + '">' +
        "<strong>" + escapeHtml(course.code) + "</strong><span>星期" + escapeHtml(course.day || "—") + "・" + escapeHtml(periodText) + (conflicts.length ? "・衝堂" : "") + "</span></button>";
    }

    function renderBoard() {
      const result = audit();
      const focusCourse = byId.get(scheduleFocusId) || null;
      const variantGroups = focusedVariantGroups(focusCourse);
      const focusedVariants = focusedCourseVariants(focusCourse);
      const rows = [];
      if (scheduleBoard) {
        scheduleBoard.classList.toggle("has-course-focus", Boolean(focusCourse));
        scheduleBoard.classList.toggle("is-mobile-distribution", Boolean(focusCourse && window.innerWidth <= 620));
      }
      if (scheduleFocusStatus) {
        scheduleFocusStatus.textContent = focusCourse ? focusCourse.name + " · " + focusedVariants.length + " 個時段" : "";
      }
      if (scheduleFocusTools) scheduleFocusTools.hidden = !focusCourse;
      if (scheduleFocusAdd) {
        scheduleFocusAdd.hidden = !focusCourse || focusCourse.closed;
        scheduleFocusAdd.textContent = focusCourse && selectedIds.has(focusCourse.id) ? "移除課程" : "加入課程";
        scheduleFocusAdd.classList.toggle("primary", Boolean(focusCourse && !selectedIds.has(focusCourse.id)));
      }
      if (scheduleFocusBrowse) scheduleFocusBrowse.hidden = !focusCourse;
      if (scheduleFocusClear) scheduleFocusClear.hidden = !focusCourse;
      if (scheduleFocusOptions) {
        scheduleFocusOptions.hidden = !focusCourse;
        scheduleFocusOptions.innerHTML = focusCourse ? focusedVariants.map(function(course) { return renderFocusOption(course, focusCourse); }).join("") : "";
      }
      for (let period = 1; period <= 10; period += 1) {
        let cells = '<tr><td class="period">' + period + "</td>";
        dayNames.forEach(function(day) {
          const key = day + "-" + period;
          const courses = result.selected.filter(function(course) {
            return course.day === day && course.periods.indexOf(period) !== -1;
          });
          const items = courses.map(function(course) {
            const isConflict = result.conflictCourseIds.has(course.id);
            const isFocused = Boolean(focusCourse && course.id === focusCourse.id);
            const isRelated = sameCourseFamily(course, focusCourse) && !isFocused;
            const periodText = String(course.period).split(" ")[0];
            const classes = ["slot", course.palette];
            if (isConflict) classes.push("conflict");
            if (isFocused) classes.push("focused-slot");
            if (isRelated) classes.push("related-slot");
            return '<button class="' + classes.join(" ") + '" type="button" data-detail="' + course.id + '" aria-label="查看 ' + escapeHtml(course.name) + '">' +
              "<span>" + escapeHtml(course.name.length > 11 ? course.name.slice(0, 11) + "…" : course.name) + "</span>" +
              "<small>" + escapeHtml(course.code) + " · " + escapeHtml(periodText) + (course.location === "校內教室" ? "" : " · " + escapeHtml(course.location)) + "</small></button>";
          }).join("");
          const variants = renderVariantSlot(variantGroups.get(key), focusCourse, key);
          cells += '<td data-day="' + day + '" data-period="' + period + '" class="' + (result.conflictKeys.has(key) ? "has-conflict" : "") + '">' + items + variants + "</td>";
        });
        rows.push(cells + "</tr>");
      }
      scheduleBody.innerHTML = rows.join("");
      document.getElementById("metricCourses").textContent = result.selected.length;
      document.getElementById("metricCredits").textContent = result.currentCredits + result.requiredCredits + result.laborCredits + result.departmentCredits;
      document.getElementById("metricConflicts").textContent = result.conflictKeys.size;
    }

    function courseMatches(course) {
      const query = searchQuery.trim().toLowerCase();
      if (!query) return true;
      return [course.code, course.name, course.teacher, course.day, course.language, course.note, course.category, course.department, course.className].join(" ").toLowerCase().indexOf(query) !== -1;
    }

    function stageLabel(course) {
      if (course.stage === "current") return "現在可選";
      if (course.stage === "required") return "校訂必修";
      if (course.stage === "department") return "設計學院";
      return "第二階段";
    }

    function coursePathLabel(course) {
      if (course.department) return course.department + (course.className ? " · " + course.className : "");
      if (course.category) return course.category.replace(/^校訂必修｜/, "");
      if (course.stage === "labor") return "勞作教育 · 20 門擇 1";
      return "校訂選修";
    }

    function courseCard(course) {
      const selected = selectedIds.has(course.id);
      const badge = course.closed ? '<span class="course-badge warn">不可選</span>' : course.restricted ? '<span class="course-badge warn">資格</span>' : '<span class="course-badge">' + stageLabel(course) + "</span>";
      const action = course.closed ? '<button class="course-action inspect" type="button" data-action="detail" data-id="' + course.id + '">查看</button>' : '<button class="course-action ' + (selected ? "remove" : "") + '" type="button" data-action="toggle" data-id="' + course.id + '">' + (selected ? "移除" : "加入") + "</button>";
      return '<article class="course-card ' + (selected ? "is-selected " : "") + (course.closed ? "is-closed" : "") + '" draggable="' + (!course.closed) + '" data-course-id="' + course.id + '">' +
        '<div class="course-card-head"><div><div class="code">' + escapeHtml(course.code) + "</div><h3>" + escapeHtml(course.name) + '</h3></div><span class="credits">' + course.credits + " 學分</span></div>" +
        '<div class="course-path">' + escapeHtml(coursePathLabel(course)) + "</div>" +
        '<div class="course-line">' + escapeHtml(course.day || "待核對") + (course.period ? "・第 " + escapeHtml(String(course.period).split(" ")[0]) + " 節" : "") + (course.location === "校內教室" || !course.period ? "" : "・" + escapeHtml(course.location)) + "　" + escapeHtml(course.teacher) + "</div>" +
        '<div class="course-card-foot">' + badge + action + "</div></article>";
    }

    function courseGroupsForStage(courses) {
      if (activeStage === "current") return [{ key: "current", title: "校訂選修", subtitle: "", courses: courses }];
      if (activeStage === "labor") return [{ key: "labor", title: "勞作教育", subtitle: "第二階段・20 門擇 1", courses: courses }];
      const order = activeStage === "required" ? [
        "校訂必修｜基礎通識",
        "校訂必修｜核心通識｜大一英文",
        "校訂必修｜核心通識｜大二英文",
        "校訂必修｜核心通識｜人文領域",
        "校訂必修｜核心通識｜社會領域",
        "校訂必修｜核心通識｜自然科學領域",
        "校訂必修｜核心通識｜綜合領域"
      ] : ["景觀及都市設計系", "建築系", "工業設計系", "視覺傳達設計系", "設計學院｜院共同"];
      const field = activeStage === "required" ? "category" : "department";
      const groups = [];
      const seen = new Set();
      order.forEach(function(key) {
        const groupCourses = courses.filter(function(course) { return course[field] === key; });
        if (groupCourses.length) {
          groups.push({ key: key, title: activeStage === "required" ? key.replace(/^校訂必修｜/, "") : key, subtitle: "", courses: groupCourses });
          seen.add(key);
        }
      });
      courses.forEach(function(course) {
        if (!seen.has(course[field])) {
          groups.push({ key: course[field] || "未分類", title: course[field] || "未分類", subtitle: "", courses: courses.filter(function(item) { return item[field] === course[field]; }) });
          seen.add(course[field]);
        }
      });
      return groups;
    }

    function renderCourseGroup(group, index) {
      const openBySearch = Boolean(searchQuery.trim());
      const openGroup = openBySearch || activeStage === "current" || activeStage === "labor";
      const credits = group.courses.reduce(function(total, course) { return total + course.credits; }, 0);
      let body = "";
      if (activeStage === "department") {
        const subgroups = [];
        const subMap = new Map();
        group.courses.forEach(function(course) {
          const key = course.className || "未標示班別";
          if (!subMap.has(key)) { const entry = { key: key, courses: [] }; subMap.set(key, entry); subgroups.push(entry); }
          subMap.get(key).courses.push(course);
        });
        body = subgroups.map(function(subgroup, subIndex) {
          const subOpen = openBySearch;
          return '<details class="course-subgroup" ' + (subOpen ? "open" : "") + '><summary><span>' + escapeHtml(subgroup.key) + '</span><small>' + subgroup.courses.length + ' 門 · ' + subgroup.courses.reduce(function(total, course) { return total + course.credits; }, 0) + ' 學分</small></summary><div class="course-group-list">' + subgroup.courses.map(courseCard).join("") + "</div></details>";
        }).join("");
      } else {
        body = '<div class="course-group-list">' + group.courses.map(courseCard).join("") + "</div>";
      }
      const subtitle = group.subtitle ? '<small>' + escapeHtml(group.subtitle) + '</small>' : "";
      return '<details class="course-group" ' + (openGroup ? "open" : "") + '><summary><span><strong>' + escapeHtml(group.title) + '</strong>' + subtitle + '</span><em>' + group.courses.length + ' 門 · ' + credits + ' 學分</em></summary>' + body + "</details>";
    }

    function renderCourseList() {
      const list = document.getElementById("courseList");
      if (!list) return;
      const courses = allCourses.filter(function(course) { return course.stage === activeStage && courseMatches(course); });
      document.getElementById("courseResultCount").textContent = courses.length + " 門";
      const groups = courseGroupsForStage(courses);
       list.innerHTML = courses.length ? groups.map(renderCourseGroup).join("") : '<div class="empty-state">無結果</div>';
      list.classList.remove("is-refreshing");
      void list.offsetWidth;
      list.classList.add("is-refreshing");
      window.setTimeout(function() { list.classList.remove("is-refreshing"); }, 230);
      const selectedList = document.getElementById("selectedMini");
      if (selectedList) {
        const selected = selectedCourses();
        const selectedMiniCount = document.getElementById("selectedMiniCount");
        if (selectedMiniCount) selectedMiniCount.textContent = selected.length ? "（" + selected.length + " 門）" : "";
        selectedList.innerHTML = selected.length ? selected.map(function(course) {
          return '<div class="selected-mini-row"><span><strong>' + escapeHtml(course.code) + "</strong> " + escapeHtml(course.name) + "</span><button class=\"minor-action\" type=\"button\" data-action=\"toggle\" data-id=\"" + course.id + '">移除</button></div>';
         }).join("") : '<div class="empty-state">無課程</div>';
      }
    }

    function libraryMarkup() {
      const currentCount = allCourses.filter(function(course) { return course.stage === "current"; }).length;
      const requiredCount = allCourses.filter(function(course) { return course.stage === "required"; }).length;
      const departmentCount = allCourses.filter(function(course) { return course.stage === "department"; }).length;
      const laborCount = allCourses.filter(function(course) { return course.stage === "labor"; }).length;
      return '<div class="panel-head"><div><h2>課程</h2></div><button class="panel-close" type="button" data-action="close" aria-label="關閉">×</button></div>' +
        '<div class="panel-note"><a href="https://cts.cyut.edu.tw/CTS0006" target="_blank" rel="noopener">核對 115-1 課堂一覽</a></div>' +
        '<div class="stage-tabs" role="tablist">' +
          '<button class="stage-tab" type="button" data-action="stage" data-stage="current" aria-selected="' + (activeStage === "current") + '"><strong>現在可選</strong><small>' + currentCount + " 門</small></button>" +
          '<button class="stage-tab" type="button" data-action="stage" data-stage="required" aria-selected="' + (activeStage === "required") + '"><strong>校訂必修</strong><small>' + requiredCount + " 門</small></button>" +
          '<button class="stage-tab" type="button" data-action="stage" data-stage="department" aria-selected="' + (activeStage === "department") + '"><strong>設計學院</strong><small>' + departmentCount + " 門</small></button>" +
          '<button class="stage-tab" type="button" data-action="stage" data-stage="labor" aria-selected="' + (activeStage === "labor") + '"><strong>勞作教育</strong><small>第二階段・' + laborCount + " 門擇 1</small></button>" +
        "</div>" +
        '<div class="field"><label for="courseSearch">搜尋課程</label><input id="courseSearch" type="search" value="' + escapeHtml(searchQuery) + '" placeholder="課號／課名／教師"></div>' +
        '<div class="list-meta"><span>符合 <strong id="courseResultCount">—</strong></span></div>' +
        '<div class="course-list" id="courseList"></div>' +
        '<div class="selected-zone"><h3>已加入課表 <span id="selectedMiniCount"></span></h3><div class="selected-mini" id="selectedMini"></div></div>';
    }

    function auditMarkup() {
      const result = audit();
      const messages = [];
      result.errors.forEach(function(message) { messages.push('<div class="audit-message error">需要處理：' + escapeHtml(message) + "</div>"); });
      result.warnings.forEach(function(message) { messages.push('<div class="audit-message warn">' + escapeHtml(message) + "</div>"); });
      if (!result.errors.length && !result.warnings.length) messages.push('<div class="audit-message ok">無衝堂</div>');
      if (!result.selected.length) messages.push('<div class="audit-message ok">請先加入課程</div>');
      return '<div class="panel-head"><div><h2>檢查</h2></div><button class="panel-close" type="button" data-action="close" aria-label="關閉">×</button></div>' +
        '<div class="audit-summary"><div class="audit-stat"><small>校訂選修</small><strong>' + result.currentCredits + " 學分</strong></div><div class=\"audit-stat\"><small>校訂必修</small><strong>" + result.requiredCredits + " 學分</strong></div><div class=\"audit-stat\"><small>設計學院</small><strong>" + result.departmentCredits + " 學分</strong></div><div class=\"audit-stat\"><small>勞作教育</small><strong>" + result.laborCredits + " 學分</strong></div><div class=\"audit-stat\"><small>已加入</small><strong>" + result.selected.length + " 門</strong></div><div class=\"audit-stat\"><small>衝堂節次</small><strong>" + result.conflictKeys.size + " 節</strong></div></div>" +
        '<div class="audit-list">' + messages.join("") + "</div>" +
        '<div class="audit-block"><h3>階段</h3><div class="button-row"><button class="minor-action primary" type="button" data-action="stage-and-library" data-stage="current">現在可選</button><button class="minor-action" type="button" data-action="stage-and-library" data-stage="required">校訂必修</button><button class="minor-action" type="button" data-action="stage-and-library" data-stage="department">設計學院</button><button class="minor-action" type="button" data-action="stage-and-library" data-stage="labor">勞作教育</button><button class="minor-action" type="button" data-action="export-plan">下載</button><button class="minor-action" type="button" data-action="clear-plan">清空</button></div></div>' +
        '<div class="audit-block"><h3>回報</h3><div class="field"><label for="reportText">差異</label><textarea id="reportText" placeholder="課號／差異"></textarea></div><button class="minor-action primary" type="button" data-action="save-report">儲存</button><div class="report-status" id="reportStatus"></div></div>';
    }

    function detailMarkup(course) {
      if (!course) return "";
      const selected = selectedIds.has(course.id);
      return '<div class="panel-head"><div><h2>課程</h2></div><button class="panel-close" type="button" data-action="close" aria-label="關閉">×</button></div>' +
        '<div class="detail-card"><div class="detail-code">' + escapeHtml(course.code) + "・" + escapeHtml(stageLabel(course)) + '</div><h3>' + escapeHtml(course.name) + '</h3><dl class="detail-list">' +
        (course.category || course.department ? "<div><dt>分類</dt><dd>" + escapeHtml(coursePathLabel(course)) + "</dd></div>" : "") +
        "<div><dt>時間</dt><dd>" + escapeHtml(course.day || "時段待核對") + (course.period ? "・第 " + escapeHtml(String(course.period).split(" ")[0]) + " 節" : "") + "</dd></div>" +
        "<div><dt>地點</dt><dd>" + escapeHtml(course.location) + "</dd></div>" +
        "<div><dt>教師</dt><dd>" + escapeHtml(course.teacher) + "</dd></div>" +
        "<div><dt>學分</dt><dd>" + course.credits + " 學分</dd></div>" +
        "<div><dt>語言</dt><dd>" + escapeHtml(course.language) + "</dd></div>" +
         "<div><dt>備註</dt><dd>" + escapeHtml(course.note || "—") + "</dd></div></dl>" +
         '<div class="detail-actions"><button class="minor-action primary" type="button" data-action="toggle" data-id="' + course.id + '">' + (selected ? "移除" : "加入") + "</button></div></div>";
    }

    function focusMarkup(course) {
      if (!course) return "";
      const selected = selectedIds.has(course.id);
      const conflicts = conflictCoursesFor(course);
      const periodText = course.period ? String(course.period).split(" ")[0] : "時段待核對";
      const variants = focusedCourseVariants(course);
      return '<div class="panel-head"><div><h2>編輯課程</h2><p>' + escapeHtml(course.name) + '</p></div><button class="panel-close" type="button" data-action="close" aria-label="關閉">×</button></div>' +
        '<div class="focus-panel-card"><div class="focus-panel-code">' + escapeHtml(course.code) + '・' + escapeHtml(stageLabel(course)) + '</div><h3>' + escapeHtml(course.name) + '</h3>' +
        '<p class="focus-panel-meta">星期' + escapeHtml(course.day || "—") + '・' + escapeHtml(periodText) + '・' + escapeHtml(course.location || "地點待核對") + '</p>' +
        (conflicts.length ? '<p class="focus-panel-conflict">衝堂：' + escapeHtml(conflictNames(conflicts)) + '</p>' : '') +
        '<div class="focus-panel-actions"><button class="minor-action primary" type="button" data-action="focus-add">' + (selected ? "移除課程" : "加入課程") + '</button><button class="minor-action" type="button" data-action="browse-courses">其他課程</button></div>' +
        '<div class="focus-panel-options-label">其他時段／課號</div><div class="focus-panel-options" aria-label="其他時段與課號">' + variants.map(function(variant) { return renderFocusOption(variant, course); }).join("") + '</div>' +
        '<p class="focus-panel-foot">點選課號切換時段；淡紅色代表與目前課表衝堂，仍可加入。</p></div>';
    }

    function renderPanel() {
      const hasPanel = Boolean(activePanel);
      appShell.classList.toggle("panel-open", hasPanel);
      document.body.classList.toggle("panel-open", hasPanel);
      panelFrame.classList.toggle("is-open", hasPanel);
      panelFrame.setAttribute("aria-hidden", String(!hasPanel));
      if (!hasPanel) {
        panelContent.innerHTML = "";
        return;
      }
      if (activePanel === "library") panelContent.innerHTML = libraryMarkup();
      if (activePanel === "check") panelContent.innerHTML = auditMarkup();
      if (activePanel === "detail") panelContent.innerHTML = detailMarkup(byId.get(detailId));
      if (activePanel === "focus") panelContent.innerHTML = focusMarkup(byId.get(detailId));
      panelContent.classList.remove("is-refreshing");
      void panelContent.offsetWidth;
      panelContent.classList.add("is-refreshing");
      window.setTimeout(function() { panelContent.classList.remove("is-refreshing"); }, 250);
      if (activePanel === "library") renderCourseList();
    }

    function setPanel(panel, id) {
      activePanel = panel;
      detailId = id || null;
      renderPanel();
    }

    function focusCourseDistribution(course) {
      if (!course) return;
      scheduleFocusId = course.id;
      if (window.innerWidth <= 620 && activePanel) setPanel(null);
      renderBoard();
    }

    function clearCourseDistribution() {
      scheduleFocusId = null;
      renderBoard();
    }

    function courseElements(id) {
      return Array.from(document.querySelectorAll("[data-detail], .course-card[data-course-id]")).filter(function(element) {
        return element.dataset.detail === id || element.dataset.courseId === id;
      });
    }

    function stopCourseMotion(id) {
      const timer = courseMotionTimers.get(id);
      if (timer) window.clearTimeout(timer);
      courseMotionTimers.delete(id);
      courseElements(id).forEach(function(element) {
        if (element.getAnimations) element.getAnimations().forEach(function(animation) { animation.cancel(); });
        element.classList.remove("is-entering", "is-leaving", "is-snapping", "is-returning");
      });
    }

    function animateCourseElements(id, motionClass) {
      window.requestAnimationFrame(function() {
        courseElements(id).forEach(function(element) {
          element.classList.remove("is-entering", "is-leaving", "is-snapping");
          void element.offsetWidth;
          element.classList.add(motionClass);
        });
      });
    }

    function refreshAfterSelectionChange() {
      renderBoard();
      if (activePanel === "library") renderCourseList();
      if (activePanel === "check" || activePanel === "detail" || activePanel === "focus") renderPanel();
    }

    function addCourseWithMotion(course, options) {
      const settings = options || {};
      stopCourseMotion(course.id);
      courseMotionStates.set(course.id, "entering");
      selectedIds.add(course.id);
      saveSelected();
      refreshAfterSelectionChange();
      animateCourseElements(course.id, settings.motionClass || "is-entering");
      courseMotionTimers.set(course.id, window.setTimeout(function() {
        if (courseMotionStates.get(course.id) !== "entering") return;
        courseMotionStates.delete(course.id);
        courseElements(course.id).forEach(function(element) { element.classList.remove("is-entering", "is-snapping"); });
      }, settings.motionClass === "is-snapping" ? 520 : 460));
      showToast(settings.message || (course.code + " 已加入"));
    }

    function removeCourseWithMotion(course) {
      stopCourseMotion(course.id);
      courseMotionStates.set(course.id, "leaving");
      const elements = courseElements(course.id);
      elements.forEach(function(element) {
        void element.offsetWidth;
        element.classList.add("is-leaving");
      });
      const finish = function() {
        if (courseMotionStates.get(course.id) !== "leaving") return;
        selectedIds.delete(course.id);
        saveSelected();
        courseMotionStates.delete(course.id);
        courseMotionTimers.delete(course.id);
        refreshAfterSelectionChange();
        showToast(course.code + " 已移除");
      };
      courseMotionTimers.set(course.id, window.setTimeout(finish, elements.length ? 320 : 0));
    }

    function toggleCourse(id, options) {
      const course = byId.get(id);
      if (!course) return;
      if (course.closed) {
        showToast("不可選");
        return;
      }
      const motionState = courseMotionStates.get(id);
      if (motionState === "leaving") {
        addCourseWithMotion(course, options);
        return;
      }
      if (selectedIds.has(id)) {
        removeCourseWithMotion(course);
      } else {
        addCourseWithMotion(course, options);
      }
    }

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("is-visible");
      toastTimer = window.setTimeout(function() { toast.classList.remove("is-visible"); }, 2600);
    }

    function exportPlan() {
      const payload = {
        semester: "115-1",
        exportedAt: new Date().toISOString(),
        courses: selectedCourses().map(function(course) {
          return { code: course.code, name: course.name, credits: course.credits, day: course.day, period: course.period, stage: course.stage };
        })
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "cyut-115-1-course-plan.json";
      link.click();
      window.setTimeout(function() { URL.revokeObjectURL(link.href); }, 1000);
      showToast("已下載目前課表。");
    }

    function saveReport() {
      const field = document.getElementById("reportText");
      const status = document.getElementById("reportStatus");
      if (!field || !field.value.trim()) {
        if (status) status.textContent = "請填寫差異";
        return;
      }
      let reports = [];
      try { reports = JSON.parse(localStorage.getItem(reportKey) || "[]"); } catch (error) { reports = []; }
      reports.push({text: field.value.trim(), createdAt: new Date().toISOString()});
      localStorage.setItem(reportKey, JSON.stringify(reports));
      field.value = "";
      if (status) status.textContent = "已儲存 " + reports.length + " 筆";
    }

    document.addEventListener("click", function(event) {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.scheduleScale) {
        applyScheduleScale(button.dataset.scheduleScale);
        return;
      }
      if (button.dataset.panel) {
        setPanel(button.dataset.panel);
        return;
      }
      if (button.dataset.action === "focus-variant") {
        const variant = byId.get(button.dataset.id);
        focusCourseDistribution(variant);
        if (window.innerWidth > 620 && activePanel === "focus" && variant) {
          detailId = variant.id;
          renderPanel();
        }
        return;
      }
      if (button.dataset.action === "focus-add") {
        if (scheduleFocusId) toggleCourse(scheduleFocusId);
        return;
      }
      if (button.dataset.action === "browse-courses") {
        clearCourseDistribution();
        setPanel("library");
        return;
      }
      if (button.dataset.detail) {
        setPanel("detail", button.dataset.detail);
        return;
      }
      const action = button.dataset.action;
      if (action === "close") setPanel(null);
      if (action === "clear-focus") {
        clearCourseDistribution();
        if (activePanel === "focus") setPanel(null);
      }
      if (action === "toggle") toggleCourse(button.dataset.id);
      if (action === "detail") setPanel("detail", button.dataset.id);
      if (action === "stage") {
        activeStage = button.dataset.stage;
        searchQuery = "";
        renderPanel();
      }
      if (action === "stage-and-library") {
        activeStage = button.dataset.stage;
        searchQuery = "";
        setPanel("library");
      }
      if (action === "save-report") saveReport();
      if (action === "export-plan") exportPlan();
      if (action === "clear-plan") {
        const ids = Array.from(selectedIds);
        if (!ids.length) {
          showToast("無課程");
          return;
        }
        ids.forEach(function(courseId, index) {
          window.setTimeout(function() {
            const course = byId.get(courseId);
            if (course) removeCourseWithMotion(course);
          }, index * 45);
        });
        showToast("清空課表");
      }
    });

    panelContent.addEventListener("input", function(event) {
      if (event.target.id === "courseSearch") {
        searchQuery = event.target.value;
        renderCourseList();
      }
    });

    panelContent.addEventListener("click", function(event) {
      const card = event.target.closest(".course-card[data-course-id]");
      if (!card || event.target.closest("button, a, input, summary")) return;
      focusCourseDistribution(byId.get(card.dataset.courseId));
    });

    panelContent.addEventListener("dragstart", function(event) {
      const card = event.target.closest(".course-card");
      if (!card || card.classList.contains("is-closed")) return;
      draggingCourseId = card.dataset.courseId;
      event.dataTransfer.setData("text/course-id", card.dataset.courseId);
      event.dataTransfer.effectAllowed = "copy";
      showDragPreview(byId.get(draggingCourseId));
    });

    panelContent.addEventListener("dragend", function() {
      draggingCourseId = null;
      clearDragPreview();
    });

    scheduleBody.addEventListener("click", function(event) {
      if (Date.now() < suppressScheduleClickUntil) return;
      const slot = event.target.closest("[data-detail]");
      if (!slot) return;
      event.stopPropagation();
      const course = byId.get(slot.dataset.detail);
      if (!course) return;
      focusCourseDistribution(course);
      if (window.innerWidth > 620) setPanel("focus", course.id);
    });

    scheduleBody.addEventListener("dragover", function(event) {
      const cell = event.target.closest("td[data-day]");
      const course = byId.get(draggingCourseId);
      if (!cell || !course) return;
      event.preventDefault();
      markDragHover(cell, course);
    });

    scheduleBody.addEventListener("dragleave", function(event) {
      const cell = event.target.closest("td[data-day]");
      if (cell) cell.classList.remove("is-drop-target", "drag-over-safe", "drag-over-conflict");
    });

    scheduleBody.addEventListener("drop", function(event) {
      const cell = event.target.closest("td[data-day]");
      if (!cell) return;
      event.preventDefault();
      cell.classList.remove("is-drop-target");
      const id = (event.dataTransfer && event.dataTransfer.getData("text/course-id")) || draggingCourseId;
      const course = byId.get(id);
      draggingCourseId = null;
      if (!course) return;
      const conflicts = conflictCoursesFor(course);
      clearDragPreview();
      if (!course.day || !course.periods.length) {
        cell.classList.remove("drop-invalid");
        void cell.offsetWidth;
        cell.classList.add("drop-invalid");
        window.setTimeout(function() { cell.classList.remove("drop-invalid"); }, 390);
        const origin = panelContent.querySelector('.course-card[data-course-id="' + course.id + '"]');
        if (origin) {
          origin.classList.remove("is-returning");
          void origin.offsetWidth;
          origin.classList.add("is-returning");
          window.setTimeout(function() { origin.classList.remove("is-returning"); }, 440);
        }
        showToast(course.code + " 待核對時段");
        return;
      }
      if (!selectedIds.has(course.id)) {
        toggleCourse(course.id, {
          motionClass: "is-snapping",
          message: conflicts.length ? course.code + " 已加入・衝堂：" + conflictNames(conflicts) : course.code + " 已吸附"
        });
      } else {
        showToast(conflicts.length ? "衝堂：" + conflictNames(conflicts) : course.code + " 已在課表");
      }
      const targetCell = scheduleBody.querySelector('td[data-day="' + course.day + '"][data-period="' + course.periods[0] + '"]');
      if (targetCell) {
        targetCell.classList.remove("snap-confirm");
        void targetCell.offsetWidth;
        targetCell.classList.add("snap-confirm");
        window.setTimeout(function() { targetCell.classList.remove("snap-confirm"); }, 520);
      }
    });

    let schedulePointerScroll = null;
    if (calendarScroll) {
      calendarScroll.addEventListener("pointerdown", function(event) {
        if (event.pointerType === "mouse" && event.button !== 0) return;
        if (event.target instanceof Element && event.target.closest("button, a, input, summary")) {
          schedulePointerScroll = null;
          return;
        }
        schedulePointerScroll = { pointerId: event.pointerId, startX: event.clientX, startScrollLeft: calendarScroll.scrollLeft, moved: false };
        if (calendarScroll.setPointerCapture) calendarScroll.setPointerCapture(event.pointerId);
      }, {passive: true});
      calendarScroll.addEventListener("pointermove", function(event) {
        if (!schedulePointerScroll || schedulePointerScroll.pointerId !== event.pointerId) return;
        const deltaX = event.clientX - schedulePointerScroll.startX;
        if (Math.abs(deltaX) < 3) return;
        schedulePointerScroll.moved = true;
        calendarScroll.scrollLeft = schedulePointerScroll.startScrollLeft - deltaX;
      }, {passive: true});
      ["pointerup", "pointercancel"].forEach(function(type) {
        calendarScroll.addEventListener(type, function(event) {
          if (schedulePointerScroll && schedulePointerScroll.pointerId === event.pointerId) {
            if (schedulePointerScroll.moved) suppressScheduleClickUntil = Date.now() + 220;
            schedulePointerScroll = null;
          }
        }, {passive: true});
      });
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape" && activePanel) setPanel(null);
    });

    let shineFrame = 0;
    let shineTarget = null;
    let shineEvent = null;
    const shineSelector = ".topbar, .panel-frame, .glass-control, .panel-close, .toast";
    document.addEventListener("pointermove", function(event) {
      if (!(event.target instanceof Element)) return;
      shineTarget = event.target.closest(shineSelector);
      shineEvent = event;
      if (!shineTarget || shineFrame) return;
      shineTarget.classList.add("is-lit");
      shineFrame = window.requestAnimationFrame(function() {
        shineFrame = 0;
        if (!shineTarget || !shineEvent) return;
        const rect = shineTarget.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const x = Math.max(0, Math.min(100, ((shineEvent.clientX - rect.left) / rect.width) * 100));
        const y = Math.max(0, Math.min(100, ((shineEvent.clientY - rect.top) / rect.height) * 100));
        shineTarget.style.setProperty("--shine-x", x + "%");
        shineTarget.style.setProperty("--shine-y", y + "%");
      });
    }, {passive: true});
    document.addEventListener("pointerout", function(event) {
      if (!(event.target instanceof Element)) return;
      const target = event.target.closest(shineSelector);
      if (target && (!event.relatedTarget || !target.contains(event.relatedTarget))) target.classList.remove("is-lit");
    }, {passive: true});

    const landingScreen = document.getElementById("landingScreen");
    const landingCanvas = document.getElementById("landingCanvas");
    const enterPlanner = document.getElementById("enterPlanner");
    const reduceLandingMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let landingIsActive = true;
    let landingFrame = 0;
    let landingDpr = 1;
    let landingWidth = 0;
    let landingHeight = 0;
    const landingTrail = [];
    const landingAmbient = [];
    const landingGlyphs = ["C", "Y", "U", "T", "c", "y", "u", "t"];

    function seedLandingAmbient() {
      if (!landingAmbient.length) {
        for (let index = 0; index < 18; index += 1) {
          landingAmbient.push({
            x: Math.random() * landingWidth,
            y: Math.random() * landingHeight,
            vx: (Math.random() - .5) * .12,
            vy: -.08 - Math.random() * .18,
            size: 11 + Math.random() * 18,
            alpha: .08 + Math.random() * .13,
            life: .5 + Math.random() * .5,
            phase: Math.random() * Math.PI * 2,
            glyph: landingGlyphs[Math.floor(Math.random() * landingGlyphs.length)]
          });
        }
      }
    }

    function spawnLandingAmbient() {
      if (!landingIsActive || reduceLandingMotion || landingAmbient.length >= 28) return;
      landingAmbient.push({
        x: Math.random() * landingWidth,
        y: landingHeight + 28,
        vx: (Math.random() - .5) * .16,
        vy: -.12 - Math.random() * .22,
        size: 10 + Math.random() * 16,
        alpha: .07 + Math.random() * .12,
        life: .3 + Math.random() * .7,
        phase: Math.random() * Math.PI * 2,
        glyph: landingGlyphs[Math.floor(Math.random() * landingGlyphs.length)]
      });
    }

    function sizeLandingCanvas() {
      if (!landingCanvas) return;
      landingDpr = Math.min(window.devicePixelRatio || 1, 2);
      landingWidth = window.innerWidth;
      landingHeight = window.innerHeight;
      landingCanvas.width = Math.round(landingWidth * landingDpr);
      landingCanvas.height = Math.round(landingHeight * landingDpr);
      landingCanvas.style.width = landingWidth + "px";
      landingCanvas.style.height = landingHeight + "px";
      const context = landingCanvas.getContext("2d");
      if (context) context.setTransform(landingDpr, 0, 0, landingDpr, 0, 0);
      seedLandingAmbient();
    }

    function addLandingGlyphs(x, y, intensity) {
      const count = intensity ? 5 : 2 + Math.floor(Math.random() * 2);
      for (let index = 0; index < count; index += 1) {
        const angle = Math.random() * Math.PI * 2;
        const distance = intensity ? Math.random() * 30 : Math.random() * 16;
        landingTrail.push({
          x: x + Math.cos(angle) * distance,
          y: y + Math.sin(angle) * distance,
          vx: (Math.random() - .5) * (intensity ? .45 : .28),
          vy: -.08 - Math.random() * (intensity ? .34 : .18),
          size: 10 + Math.random() * (intensity ? 13 : 9),
          alpha: intensity ? .76 : .56,
          life: 1,
          rotation: (Math.random() - .5) * .16,
          spin: (Math.random() - .5) * .012,
          glyph: landingGlyphs[Math.floor(Math.random() * landingGlyphs.length)]
        });
      }
      if (landingTrail.length > 150) landingTrail.splice(0, landingTrail.length - 150);
    }

    function paintLandingTrail() {
      if (!landingIsActive || !landingCanvas) return;
      const context = landingCanvas.getContext("2d");
      if (!context) return;
      context.clearRect(0, 0, landingWidth, landingHeight);
      context.textAlign = "center";
      context.textBaseline = "middle";
      if (Math.random() < .035) spawnLandingAmbient();
      landingAmbient.forEach(function(point) {
        point.x += point.vx;
        point.y += point.vy;
        point.phase += .012;
        if (point.y < -38 || point.x < -42 || point.x > landingWidth + 42) {
          point.x = Math.random() * landingWidth;
          point.y = landingHeight + 28;
          point.phase = Math.random() * Math.PI * 2;
        }
        context.save();
        context.translate(point.x, point.y);
        context.rotate(Math.sin(point.phase) * .08);
        context.globalAlpha = point.alpha * (.72 + Math.sin(point.phase) * .16);
        context.font = "600 " + point.size + "px system-ui, sans-serif";
        context.fillStyle = "#6c98aa";
        context.shadowColor = "rgba(255, 255, 255, .64)";
        context.shadowBlur = 9;
        context.fillText(point.glyph, 0, 0);
        context.restore();
      });
      for (let index = landingTrail.length - 1; index >= 0; index -= 1) {
        const point = landingTrail[index];
        point.x += point.vx;
        point.y += point.vy;
        point.rotation += point.spin;
        point.life *= .945;
        if (point.life < .035) {
          landingTrail.splice(index, 1);
          continue;
        }
        context.save();
        context.translate(point.x, point.y);
        context.rotate(point.rotation);
        context.globalAlpha = point.alpha * point.life;
        context.font = "600 " + point.size + "px system-ui, sans-serif";
        context.fillStyle = "#5f8da2";
        context.shadowColor = "rgba(255, 255, 255, .72)";
        context.shadowBlur = 10;
        context.fillText(point.glyph, 0, 0);
        context.restore();
      }
      landingFrame = window.requestAnimationFrame(paintLandingTrail);
    }

    function updateLandingPointer(event) {
      if (!landingIsActive || reduceLandingMotion || event.pointerType === "touch") return;
      landingScreen.style.setProperty("--landing-x", event.clientX + "px");
      landingScreen.style.setProperty("--landing-y", event.clientY + "px");
      addLandingGlyphs(event.clientX, event.clientY, event.buttons > 0);
    }

    function leaveLanding() {
      if (!landingIsActive) return;
      landingIsActive = false;
      if (landingFrame) window.cancelAnimationFrame(landingFrame);
      landingTrail.length = 0;
      landingAmbient.length = 0;
      const context = landingCanvas && landingCanvas.getContext("2d");
      if (context) context.clearRect(0, 0, landingWidth, landingHeight);
      enterPlanner.disabled = true;
      landingScreen.setAttribute("aria-hidden", "true");
      landingScreen.classList.add("is-leaving");
      document.body.classList.remove("landing-active");
      window.setTimeout(function() {
        landingScreen.hidden = true;
      }, 540);
    }

    if (landingScreen && landingCanvas && enterPlanner) {
      sizeLandingCanvas();
      window.addEventListener("resize", sizeLandingCanvas, {passive: true});
      if (!reduceLandingMotion) {
        landingScreen.addEventListener("pointermove", updateLandingPointer, {passive: true});
        landingFrame = window.requestAnimationFrame(paintLandingTrail);
      }
      enterPlanner.addEventListener("click", leaveLanding);
    }

    applyScheduleScale(readScheduleScale());
    renderBoard();
  </script>
</body>
</html>
